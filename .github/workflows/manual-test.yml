name: Manual API Testing

on:
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Number of rows to test per sheet (leave empty for all)'
        required: false
        type: number

jobs:
  manual-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Manual Test
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        EMAIL_ID: ${{ secrets.EMAIL_ID }}
        API_KEY: ${{ secrets.API_KEY }}
        SESSION_ID: ${{ secrets.SESSION_ID }}
        AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        TEST_LIMIT: ${{ inputs.test_limit }}
      run: |
        echo "🧪 Running manual test..."
        if [ -n "$TEST_LIMIT" ]; then
          echo "Testing first $TEST_LIMIT rows per sheet"
        else
          echo "Testing all rows"
        fi
        python integrated_test_comparison.py
        
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: manual-test-results-${{ github.run_number }}
        path: |
          Degraded_Responses_Report.xlsx
          Direct Query Master List V_Test.xlsx
        retention-days: 30

    - name: Deploy API to Azure App Service
      if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'kata-api-v2'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .
        
    - name: Verify API Deployment
      run: |
        echo "🔍 Waiting for API to start..."
        sleep 30
        echo "Testing API health endpoint..."
        curl -f https://kata-api-v2.azurewebsites.net/api/health || echo "⚠️ API health check failed"

    - name: Summary
      if: success()
      run: |
        echo "=================================================="
        echo "✅ Manual Test & Deployment Complete"
        echo "=================================================="
        echo ""
        echo "Results uploaded to:"
        echo "  - Azure Blob Storage: kata-reports/degraded_responses.xlsx"
        echo "  - GitHub Artifacts: Available for 30 days"
        echo ""
        echo "API Deployment:"
        echo "  - URL: https://kata-api-v2.azurewebsites.net"
        echo "  - Health Check: https://kata-api-v2.azurewebsites.net/api/health"
        echo "  - Data Endpoint: https://kata-api-v2.azurewebsites.net/api/degraded-responses"
        echo "  - API Docs: https://kata-api-v2.azurewebsites.net/docs"
        echo "=================================================="
